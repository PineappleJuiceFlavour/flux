# Builds a Flux release on GitHub's Windows machines when a version tag (v1.2.3) is pushed, signs
# the update, records build provenance (anyone can check where the exe came from with
# `gh attestation verify Flux.exe -R PineappleJuiceFlavour/flux`) and attaches the files to the
# GitHub release for that tag.
#
# Needs one repo secret: FLUX_UPDATE_KEY = the contents of
# %USERPROFILE%\.flux-signing\flux-update-key.json (Settings > Secrets and variables > Actions).
# Optional: repo variable FLUX_MSA_CLIENT_ID = Flux's Microsoft app id, once Mojang approves it;
# repo secret FLUX_CURSEFORGE_KEY = Flux's own CurseForge API key.
#
# Speed: compiling everything from scratch takes 12-18 minutes. The build cache keeps the
# compiled libraries (target/), but GitHub only lets a tag's run read caches saved from the default branch,
# so pushes to main that change the code build too (nothing is published) and save the cache;
# release tags then only recompile Flux's own crates.

name: Release

on:
  push:
    tags: ["v*"]
    # Keeps the build cache warm for the next release (see Speed above); publishes nothing.
    branches: [main]
    paths: ["crates/**", "vendor/**", "Cargo.lock", "Cargo.toml", "rust-toolchain.toml", "scripts/ci_release.py", ".github/workflows/release.yml"]
  # Manual run: builds and attests only, nothing is published.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# A newer push to main replaces an older cache build; release tags always run to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      # Compiled dependencies from a main build: only Flux's own crates rebuild. (Not rust-cache:
      # it prunes everything that isn't from crates.io, which is all of vendor/, and saved nothing.)
      # Vendored crates are fingerprinted by version, not file times, so a fresh checkout reuses them.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: target
          key: release-target-${{ runner.os }}-rust1.99.0-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and sign
        shell: bash
        env:
          FLUX_UPDATE_KEY: ${{ secrets.FLUX_UPDATE_KEY }}
          FLUX_MSA_CLIENT_ID: ${{ vars.FLUX_MSA_CLIENT_ID }}
          FLUX_CURSEFORGE_KEY: ${{ secrets.FLUX_CURSEFORGE_KEY }}
          FLUX_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-test' }}
        run: |
          pip install cryptography
          python scripts/ci_release.py

      - name: Save build cache
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: release-target-${{ runner.os }}-rust1.99.0-${{ hashFiles('Cargo.lock') }}

      - name: Build provenance
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Flux.exe

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="SHA-256 (Flux.exe): $(cut -d' ' -f1 dist/SHA256.txt)

          Built from ${GITHUB_SHA} by GitHub Actions. Verify with: gh attestation verify Flux.exe -R ${GITHUB_REPOSITORY}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Flux.exe dist/update_manifest_windows.json --clobber
          else
            gh release create "$TAG" dist/Flux.exe dist/update_manifest_windows.json --title "Flux ${TAG#v}" --notes "$NOTES"
          fi
          # gh uploads into a draft and then publishes it; 1.2.7 was once left a draft (invisible to
          # downloads and the updater) without any error, so publish it explicitly and check.
          gh release edit "$TAG" --draft=false --latest
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: flux-test-build
          path: dist/
